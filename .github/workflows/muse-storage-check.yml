name: muse-storage-check

# Bounded manual validation only. No cron, production DB, publishing or Drive writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-pull
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install storage and Drive clients
        shell: bash
        run: |
          if python -m pip install boto3 -r analytics/requirements-drive.txt > "$RUNNER_TEMP/muse-install.log" 2>&1; then
            echo '{"step":"dependencies","status":"ok"}'
          else
            echo '{"step":"dependencies","status":"failed"}'
            exit 1
          fi
      - name: Verify private Drive to R2 round trip
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          R2_PRIVATE_CONFIRMED: ${{ vars.R2_PRIVATE_CONFIRMED }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.muse_drive_r2_check

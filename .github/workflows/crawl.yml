name: crawl

# Phase B crawl pipeline. Each job is just a curl to a token-protected admin
# endpoint on the Render backend; no Python/Docker setup needed in the runner.
#
# Schedules are intentionally offset from the top of the hour so we don't
# pile on with everyone else's crons. fetch every 4h, extract 3x daily,
# tag once daily.
#
# Extract cadence is sized for the v3.1/flash-lite backfill (2026-07-27):
# 5,413 churches to re-extract, and at 75/run x 3 runs = 225/day nominal,
# ~190/day after the historical ~15% per-batch error rate, that lands around
# 28 days. Measured cost per church is ~7s (batch=50 runs took 165-354s), so
# 75 is ~9 min and the curl timeout has room. Drop back to 50 x 2/day once
# /api/stats reports extraction.stale near zero — this cadence exists for a
# finite job, not because the steady state needs it.
#
# Ordering: extract `needs: [fetch]` and tag `needs: [extract]` so a manual
# `stage=all` dispatch runs the three sequentially. Scheduled crons hit a
# single stage at a time; `always()` lets the downstream job run even when
# its upstream is skipped (because the upstream's `if:` evaluated false).
#
# Failure alerting: the `alert` job opens (or comments on) a GitHub issue
# whenever a stage fails, so a bad CRAWL_TOKEN or a Render outage surfaces
# instead of the pipeline going quiet. Silence used to be indistinguishable
# from success here — see .github/workflows/keepalive.yml for the other half
# of that story. `resolve` closes that issue again once /api/stats says the
# whole pipeline is healthy; an alert that never clears stops being read.

on:
  schedule:
    - cron: '17 */4 * * *'        # fetch
    - cron: '37 2,10,18 * * *'    # extract — 3x/day for the backfill
    - cron: '47 7 * * *'          # tag
  workflow_dispatch:
    inputs:
      stage:
        description: 'Which stage to run'
        type: choice
        required: true
        default: 'fetch'
        options: [fetch, extract, tag, all]
      batch:
        description: 'Batch size'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  fetch:
    if: |
      github.event.schedule == '17 */4 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.stage == 'fetch' || github.event.inputs.stage == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/admin/crawl/fetch
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || '50' }}
        run: |
          curl -fsS --max-time 600 -X POST \
            -H "X-Crawl-Token: $CRAWL_TOKEN" \
            "$BACKEND_URL/api/admin/crawl/fetch?batch=$BATCH"

  extract:
    needs: [fetch]
    if: |
      always() && (
        github.event.schedule == '37 2,10,18 * * *' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.stage == 'extract' || github.event.inputs.stage == 'all'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/admin/crawl/extract
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || '75' }}
        run: |
          curl -fsS --max-time 1200 -X POST \
            -H "X-Crawl-Token: $CRAWL_TOKEN" \
            "$BACKEND_URL/api/admin/crawl/extract?batch=$BATCH"

  tag:
    needs: [extract]
    if: |
      always() && (
        github.event.schedule == '47 7 * * *' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.stage == 'tag' || github.event.inputs.stage == 'all'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/admin/crawl/tag
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || '500' }}
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "X-Crawl-Token: $CRAWL_TOKEN" \
            "$BACKEND_URL/api/admin/crawl/tag?batch=$BATCH"

  # Needs GITHUB_TOKEN write access to issues. If this job 403s, flip
  # Settings → Actions → General → Workflow permissions to "Read and write".
  alert:
    needs: [fetch, extract, tag]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the crawl-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh has no git remote to infer from.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name == 'schedule' && format('schedule ({0})', github.event.schedule) || github.event_name }}
        run: |
          set -euo pipefail
          # Idempotent: the label may or may not exist yet.
          gh label create crawl-alert \
            --color B60205 \
            --description "Crawl pipeline stage failed" >/dev/null 2>&1 || true

          body=$(printf '%s\n' \
            "A crawl stage failed." \
            "" \
            "- Run: $RUN_URL" \
            "- Trigger: $TRIGGER" \
            "- Failed jobs: fetch=${{ needs.fetch.result }}, extract=${{ needs.extract.result }}, tag=${{ needs.tag.result }}" \
            "" \
            "Usual suspects: an expired or rotated \`CRAWL_TOKEN\`, the Render backend" \
            "cold-starting past the curl timeout, or Supabase refusing connections." \
            "" \
            "This closes itself once a later run is green AND /api/stats reports" \
            "every stage inside its freshness budget. Further failures comment here" \
            "instead of filing duplicates.")

          existing=$(gh issue list \
            --label crawl-alert --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create \
              --title "crawl pipeline failing" \
              --label crawl-alert \
              --body "$body"
          fi

  # The other half of `alert`. Without this the issue never closes: #19 sat
  # open through five green runs after a transient Supabase refusal, which
  # turns the alert label into background noise — and an alert nobody believes
  # is worth about as much as no alert, which is the failure mode this whole
  # workflow exists to avoid.
  #
  # Gated on the *pipeline*, not on this run. A green fetch says nothing about
  # extract, and a scheduled run only ever exercises one stage; `pipeline_ok`
  # is true only when every stage has made progress inside its budget. So the
  # issue closes when the pipeline is healthy, not when one stage got lucky.
  resolve:
    needs: [fetch, extract, tag]
    # Not `success()`: on a scheduled run the two stages that didn't fire are
    # skipped, and `success()` is false for a skipped dependency. What matters
    # is that nothing failed.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the crawl-failure issue once the pipeline is healthy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing=$(gh issue list \
            --label crawl-alert --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            echo "no open crawl-alert issue; nothing to close"
            exit 0
          fi

          # /api/stats is public — no CRAWL_TOKEN needed here. -sS so a
          # malformed URL is an error message rather than empty output; the
          # runbook in TODOS.md has the same note for the same reason.
          #
          # Every failure below resolves to "not healthy, leave it open, exit
          # 0". Two separate reasons: a backend that can't answer is evidence
          # against closing, never for it; and under `set -e` an unparseable
          # body (Render serves HTML on a cold-start 502) would fail this step
          # and paint a successful crawl run red.
          stats=$(curl -sS --max-time 60 "$BACKEND_URL/api/stats" || true)
          ok=$(printf '%s' "$stats" | jq -r '.crawl.pipeline_ok // false' 2>/dev/null || echo false)

          if [ "$ok" != "true" ]; then
            echo "pipeline_ok=$ok — leaving #$existing open"
            printf '%s' "$stats" | jq -c '.crawl.stages' 2>/dev/null \
              || echo "(no parseable stats from $BACKEND_URL/api/stats)"
            exit 0
          fi

          # The endpoint caches for 5 minutes, so this can be up to that stale.
          # Budgets are measured in hours, so the only thing that costs is
          # closing one run later than strictly possible. Closing late is
          # harmless; closing while still broken is not.
          summary=$(printf '%s' "$stats" | jq -r '
            .crawl.stages | to_entries
            | map("\(.key): \(.value.age_seconds // "never")s old, budget \(.value.max_age_seconds)s")
            | join("\n")' 2>/dev/null || echo "(stage detail unavailable)")

          gh issue close "$existing" --reason completed --comment "$(printf '%s\n' \
            "Pipeline recovered — closing automatically." \
            "" \
            "\`/api/stats\` reports \`pipeline_ok: true\`, i.e. every stage has made" \
            "progress inside its freshness budget:" \
            "" \
            '```' \
            "$summary" \
            '```' \
            "" \
            "- Green run: $RUN_URL" \
            "" \
            "A later failure files a new issue rather than reopening this one.")"
          echo "closed #$existing"

# Local analytics sidecar. No secrets: defaults point at the local cluster
# started per analytics/README.md; override with env vars for another target.
churchmap_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('ANALYTICS_PGHOST', 'localhost') }}"
      port: "{{ env_var('ANALYTICS_PGPORT', '5433') | int }}"
      user: "{{ env_var('ANALYTICS_PGUSER', 'analytics') }}"
      password: "{{ env_var('ANALYTICS_PGPASSWORD', '') }}"
      dbname: "{{ env_var('ANALYTICS_PGDATABASE', 'churchmap_analytics') }}"
      schema: analytics
      threads: 4
    # Selected only by the gated cloud runner; no localhost/owner fallback.
    cloud:
      type: postgres
      host: "{{ env_var('ANALYTICS_CLOUD_PGHOST', '') }}"
      port: "{{ env_var('ANALYTICS_CLOUD_PGPORT', '5432') | int }}"
      user: "{{ env_var('ANALYTICS_CLOUD_PGUSER', '') }}"
      password: "{{ env_var('ANALYTICS_CLOUD_PGPASSWORD', '') }}"
      dbname: "{{ env_var('ANALYTICS_CLOUD_PGDATABASE', '') }}"
      schema: analytics
      threads: 1
      sslmode: require
      connect_timeout: 10
      retries: 0

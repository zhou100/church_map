# Local analytics sidecar. No secrets: defaults point at the local cluster
# started per analytics/README.md; override with env vars for another target.
churchmap_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('ANALYTICS_PGHOST', 'localhost') }}"
      port: "{{ env_var('ANALYTICS_PGPORT', '5433') | int }}"
      user: "{{ env_var('ANALYTICS_PGUSER', 'analytics') }}"
      password: "{{ env_var('ANALYTICS_PGPASSWORD', '') }}"
      dbname: "{{ env_var('ANALYTICS_PGDATABASE', 'churchmap_analytics') }}"
      schema: analytics
      threads: 4
    # Only the guarded disposable-job runner selects this target.
    job:
      type: postgres
      host: "{{ env_var('ANALYTICS_JOB_PGHOST', '') }}"
      port: "{{ env_var('ANALYTICS_JOB_PGPORT', '5432') | int }}"
      user: "{{ env_var('ANALYTICS_JOB_PGUSER', '') }}"
      password: "{{ env_var('ANALYTICS_JOB_PGPASSWORD', '') }}"
      dbname: "{{ env_var('ANALYTICS_JOB_PGDATABASE', '') }}"
      schema: analytics
      threads: 1
      sslmode: disable
      connect_timeout: 10
      retries: 0

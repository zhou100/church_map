name: churchmap_analytics
version: "0.1.0"
config-version: 2
profile: churchmap_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Date the D-3 freshness rules are evaluated against. Pin it for reproducible
  # builds; defaults to the day of the Muse returns.
  as_of_date: "2026-10-19"

models:
  churchmap_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  churchmap_analytics:
    +schema: seeds
    +quote_columns: false
    # Every seed column is text unless listed: the Muse files have many columns that are
    # empty in a given batch, and agate would otherwise guess integer for them.
    muse_manifest:
      +column_types: {church_id: bigint, latitude: double precision, longitude: double precision,
                      name: text, known_city: text, state: text, known_street: text, known_website: text,
                      known_phone: text, osm_ref: text, denomination_hint: text, gaps: text, handling: text, batch: text}
    muse_results:
      +column_types:
        church_id: bigint
        batch: text
        entity_type: text
        status: text
        status_source_url: text
        status_source_type: text
        current_name: text
        official_url: text
        url_evidence: text
        facebook_page_url: text
        fb_page_evidence: text
        fb_last_post_date: date
        street_address: text
        city: text
        state: text
        zip: text
        address_source_url: text
        address_source_type: text
        address_is_worship_location: text
        meets_in_building_of: text
        pin_check: text
        phone: text
        phone_source_url: text
        phone_source_type: text
        service_times_verbatim: text
        service_languages: text
        service_source_url: text
        service_source_type: text
        kids_program_verbatim: text
        kids_source_url: text
        kids_source_type: text
        match_confidence: text
        duplicate_of_church_id: bigint
        checked_at: timestamptz
        personal_phone_withheld: boolean
        checked_at_reliable: boolean
        service_times_unsupported: boolean
        address_unsupported: boolean
        last_pass: text
        source_file: text
    muse_candidates:
      +column_types:
        candidate_id: text
        task: text
        format: text
        candidate_name: text
        current_name_native: text
        denomination_stated: text
        city: text
        state: text
        zip: text
        official_url: text
        url_evidence: text
        facebook_page_url: text
        fb_page_evidence: text
        fb_last_post_date: date
        status: text
        status_source_url: text
        status_source_type: text
        street_address: text
        address_source_url: text
        address_source_type: text
        address_is_worship_location: text
        host_church_id: bigint
        host_venue_name: text
        phone: text
        phone_source_url: text
        phone_source_type: text
        service_times_verbatim: text
        service_languages: text
        service_source_url: text
        service_source_type: text
        kids_program_verbatim: text
        kids_source_url: text
        kids_source_type: text
        possible_match_church_id: bigint
        possible_match_candidate_id: text
        duplicate_of_church_id: bigint
        match_confidence: text
        found_via: text
        checked_at: timestamptz
        checked_at_reliable: boolean
        personal_phone_withheld: boolean
        service_times_unsupported: boolean
        address_unsupported: boolean
        last_pass: text
        source_file: text
    quality_reviews:
      +column_types: {church_id: bigint, reviewed_on: date, auditor_value: text, muse_value: text}
    dedup_candidates:
      +column_types: {keep_id: bigint, drop_id: bigint, score: double precision}
    fact_holds:
      +column_types: {church_id: bigint}
    geocodes:
      +column_types: {geo_id: text, subject_type: text, subject_id: text, status: text,
                      latitude: double precision, longitude: double precision, match_type: text,
                      matched_address: text, tiger_line_id: text, side: text,
                      distance_from_current_pin_m: double precision, geocoded_at: timestamptz,
                      geocoded_street: text, geocoded_city: text, geocoded_zip: text, input_sha256: text}
    source_checks:
      +column_types: {subject_type: text, subject_id: text, fact_group: text, verdict: text,
                      http_status: text, match_mode: text, checked_at: timestamptz, carried_over: boolean}

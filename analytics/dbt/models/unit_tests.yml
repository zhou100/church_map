version: 2

# dbt unit tests (dbt >= 1.8): fixed inputs, no seeds or warehouse data needed.
unit_tests:
  - name: visit_ready_requires_the_worship_location
    description: >
      Identical churches that differ only in address_is_worship_location. An office or
      mailing address ("no") or an unknown one is never visit-ready (review of e9980b51).
    model: int_location_readiness
    given:
      - input: ref('stg_churches')
        rows:
          - {church_id: 1, source: osm, street_text: Main St, has_house_number: false, has_google_address: false, city: San Mateo, state: CA, coords_ok: true}
          - {church_id: 2, source: osm, street_text: Main St, has_house_number: false, has_google_address: false, city: San Mateo, state: CA, coords_ok: true}
          - {church_id: 3, source: osm, street_text: Main St, has_house_number: false, has_google_address: false, city: San Mateo, state: CA, coords_ok: true}
      - input: ref('int_scope')
        rows:
          - {church_id: 1, scope_status: in_scope}
          - {church_id: 2, scope_status: in_scope}
          - {church_id: 3, scope_status: in_scope}
      - input: ref('stg_muse_results')
        rows:
          - {church_id: 1, muse_batch: A_calibration, muse_status: active, pin_check: matches, street_address: 100 Main St, address_source_type: own_site, phone: '650-555-0100', phone_source_type: own_site, address_is_worship_location: 'yes'}
          - {church_id: 2, muse_batch: A_calibration, muse_status: active, pin_check: matches, street_address: 100 Main St, address_source_type: own_site, phone: '650-555-0100', phone_source_type: own_site, address_is_worship_location: 'no'}
          - {church_id: 3, muse_batch: A_calibration, muse_status: active, pin_check: matches, street_address: 100 Main St, address_source_type: own_site, phone: '650-555-0100', phone_source_type: own_site, address_is_worship_location: unknown}
      - input: ref('stg_source_checks')
        rows:
          - {subject_type: church, subject_id: '1', fact_group: address, is_verified: true}
          - {subject_type: church, subject_id: '1', fact_group: phone, is_verified: true}
          - {subject_type: church, subject_id: '2', fact_group: address, is_verified: true}
          - {subject_type: church, subject_id: '2', fact_group: phone, is_verified: true}
          - {subject_type: church, subject_id: '3', fact_group: address, is_verified: true}
          - {subject_type: church, subject_id: '3', fact_group: phone, is_verified: true}
      - input: ref('fact_holds')
        format: sql
        rows: "select null::bigint as church_id, null::text as field, null::text as reason where false"
      - input: ref('int_coordinate_clusters')
        format: sql
        rows: "select null::bigint as church_id, null::bigint as records_at_point where false"
      - input: ref('int_geocodes')
        format: sql
        rows: "select null::text as subject_type, null::text as subject_id, null::text as geocode_status, null::boolean as pin_usable, null::float8 as latitude, null::float8 as longitude, null::float8 as distance_from_current_pin_m where false"
    expect:
      rows:
        - {church_id: 1, address_displayable: true, visit_ready: true}
        - {church_id: 2, address_displayable: true, visit_ready: false}
        - {church_id: 3, address_displayable: true, visit_ready: false}

  - name: profile_ready_requires_the_worship_location
    description: The same rule for congregations found outside the directory.
    model: int_candidate_readiness
    given:
      - input: ref('stg_muse_candidates')
        rows:
          - {candidate_id: X-1, is_new_congregation: true, muse_status: active, street_address: 100 Main St, address_source_type: own_site, phone: '650-555-0100', phone_source_type: own_site, address_is_worship_location: 'yes'}
          - {candidate_id: X-2, is_new_congregation: true, muse_status: active, street_address: 100 Main St, address_source_type: own_site, phone: '650-555-0100', phone_source_type: own_site, address_is_worship_location: 'no'}
          - {candidate_id: X-3, is_new_congregation: true, muse_status: active, street_address: 100 Main St, address_source_type: own_site, phone: '650-555-0100', phone_source_type: own_site, address_is_worship_location: unknown}
      - input: ref('stg_source_checks')
        rows:
          - {subject_type: candidate, subject_id: X-1, fact_group: address, is_verified: true}
          - {subject_type: candidate, subject_id: X-1, fact_group: phone, is_verified: true}
          - {subject_type: candidate, subject_id: X-2, fact_group: address, is_verified: true}
          - {subject_type: candidate, subject_id: X-2, fact_group: phone, is_verified: true}
          - {subject_type: candidate, subject_id: X-3, fact_group: address, is_verified: true}
          - {subject_type: candidate, subject_id: X-3, fact_group: phone, is_verified: true}
      - input: ref('int_geocodes')
        rows:
          - {subject_type: candidate, subject_id: X-1, geocode_status: ok, pin_usable: true, latitude: 37.5, longitude: -122.3}
          - {subject_type: candidate, subject_id: X-2, geocode_status: ok, pin_usable: true, latitude: 37.5, longitude: -122.3}
    expect:
      rows:  # a pin alone doesn't make X-2 map-ready: it isn't profile-ready
        - {candidate_id: X-1, address_displayable: true, profile_ready: true, map_ready: true}
        - {candidate_id: X-2, address_displayable: true, profile_ready: false, map_ready: false}
        - {candidate_id: X-3, address_displayable: true, profile_ready: false, map_ready: false}

  - name: a_pin_counts_only_for_the_address_it_was_geocoded_from
    description: >
      A Census pin is bound to its geocoded address. Case and spacing don't matter; a
      moved address, a missing record, or a non-ok geocode never gives a usable pin.
    model: int_geocodes
    given:
      - input: ref('stg_geocodes')
        rows:
          - {geo_id: 'candidate:X-1', subject_type: candidate, subject_id: X-1, geocode_status: ok, latitude: 37.5, longitude: -122.3, geocoded_street: 100 Main St, geocoded_city: San Mateo, geocoded_zip: '94401'}
          - {geo_id: 'candidate:X-2', subject_type: candidate, subject_id: X-2, geocode_status: ok, latitude: 37.5, longitude: -122.3, geocoded_street: 100 Main St, geocoded_city: San Mateo, geocoded_zip: '94401'}
          - {geo_id: 'candidate:X-3', subject_type: candidate, subject_id: X-3, geocode_status: needs_review, geocoded_street: 100 Main St, geocoded_city: San Mateo, geocoded_zip: '94401'}
          - {geo_id: 'candidate:X-9', subject_type: candidate, subject_id: X-9, geocode_status: ok, latitude: 37.5, longitude: -122.3, geocoded_street: 100 Main St, geocoded_city: San Mateo, geocoded_zip: '94401'}
          - {geo_id: 'church:7', subject_type: church, subject_id: '7', geocode_status: ok, latitude: 37.5, longitude: -122.3, geocoded_street: 5 Oak Ave, geocoded_city: Pacifica, geocoded_zip: '94044'}
      - input: ref('stg_muse_candidates')
        rows:
          - {candidate_id: X-1, street_address: 100  MAIN st, city: San Mateo, zip: '94401'}
          - {candidate_id: X-2, street_address: 200 Main St, city: San Mateo, zip: '94401'}
          - {candidate_id: X-3, street_address: 100 Main St, city: San Mateo, zip: '94401'}
      - input: ref('stg_muse_results')
        rows:
          - {church_id: 7, street_address: 5 Oak Ave, city: null, zip: '94044'}
      - input: ref('stg_churches')
        rows:
          - {church_id: 7, city: Pacifica}
    expect:
      rows:
        - {geo_id: 'candidate:X-1', address_unchanged: true, pin_usable: true}
        - {geo_id: 'candidate:X-2', address_unchanged: false, pin_usable: false}
        - {geo_id: 'candidate:X-3', address_unchanged: true, pin_usable: false}
        - {geo_id: 'candidate:X-9', address_unchanged: false, pin_usable: false}
        - {geo_id: 'church:7', address_unchanged: true, pin_usable: true}

  - name: a_new_congregation_is_matched_against_the_raw_directory_address
    description: >
      Review of e734ff1: directory church 1 has no Muse result, so no verified address.
      A candidate with its name at its raw directory address is that church found again.
      A different name at the same address (a guest) and the same name elsewhere are not.
    model: mart_new_congregation_directory_matches
    given:
      - input: ref('mart_new_congregations')
        rows:
          - {candidate_id: X-1, candidate_name: Grace Church, display_street_address: 100  Main St, city: Sacramento}
          - {candidate_id: X-2, candidate_name: Iglesia Nueva Vida, display_street_address: 100 Main St, city: Sacramento}
          - {candidate_id: X-3, candidate_name: Grace Church, display_street_address: 9 Elm St, city: Davis}
      - input: ref('dim_church')
        rows:
          - {church_id: 1, display_name: Grace Church, osm_name: Grace Church, display_street_address: null, city: Sacramento}
      - input: ref('stg_churches')
        rows:
          - {church_id: 1, street_text: 100 Main St, city: Sacramento}
      - input: ref('int_geocodes')
        format: sql
        rows: "select null::text as subject_type, null::text as subject_id, null::boolean as pin_usable, null::text as matched_address where false"
    expect:
      rows:
        - {candidate_id: X-1, church_id: 1, matched_on: directory_address}

  - name: a_congregation_verdict_settles_only_pending_labels
    description: >
      Muse outranks the denomination mapping. A congregation verdict resolves a
      pending label (review of #47: pending labels must not undo confirmed
      congregations) but leaves an out_of_scope ruling and an in_scope_labeled
      label alone; a negative verdict still hides a pending label.
    model: int_scope
    given:
      - input: ref('stg_churches')
        rows:
          - {church_id: 1, osm_name: First Universalist, denomination: Universalist}
          - {church_id: 2, osm_name: Second Universalist, denomination: Universalist}
          - {church_id: 3, osm_name: Third Universalist, denomination: Universalist}
          - {church_id: 4, osm_name: Unitarian Society, denomination: Unitarian Universalist}
          - {church_id: 5, osm_name: Ward Chapel, denomination: Mormon}
          - {church_id: 6, osm_name: Beth Yeshua, denomination: Messianic Jewish}
      - input: ref('denomination_scope')
        rows:
          - {denomination_key: universalist, scope_status: pending, display_tradition: null}
          - {denomination_key: unitarian universalist, scope_status: out_of_scope, display_tradition: null}
          - {denomination_key: mormon, scope_status: in_scope_labeled, display_tradition: The Church of Jesus Christ of Latter-day Saints}
      - input: ref('stg_muse_results')
        rows:
          - {church_id: 1, entity_type: congregation, duplicate_of_church_id: null}
          - {church_id: 3, entity_type: non_christian, duplicate_of_church_id: null}
          - {church_id: 4, entity_type: congregation, duplicate_of_church_id: null}
          - {church_id: 5, entity_type: congregation, duplicate_of_church_id: null}
          - {church_id: 6, entity_type: congregation, duplicate_of_church_id: null}
    expect:
      rows:
        - {church_id: 1, scope_status: in_scope, scope_basis: muse}
        - {church_id: 2, scope_status: pending, scope_basis: denomination}
        - {church_id: 3, scope_status: out_of_scope, scope_basis: muse}
        - {church_id: 4, scope_status: out_of_scope, scope_basis: denomination}
        - {church_id: 5, scope_status: in_scope_labeled, scope_basis: denomination}
        - {church_id: 6, scope_status: in_scope, scope_basis: muse}

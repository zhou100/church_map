version: 2

models:
  - name: stg_churches
    description: One directory record per church_id, lightly cleaned.
    columns:
      - name: church_id
        tests: [unique, not_null]

  - name: stg_muse_results
    description: One Muse verdict per manifest church (latest pass).
    columns:
      - name: church_id
        tests:
          - unique
          - not_null
          - relationships: {to: ref('stg_churches'), field: church_id}
      - name: entity_type
        tests:
          - accepted_values: {values: [congregation, religious_house, non_christian, business, other, unknown]}
      - name: muse_status
        tests:
          - accepted_values: {values: [active, closed, moved, merged, unresolved]}
      - name: match_confidence
        tests:
          - accepted_values: {values: [high, medium, low]}
      - name: address_source_type
        tests:
          - accepted_values: {values: [own_site, fb_page, denomination, other]}
      - name: phone_source_type
        tests:
          - accepted_values: {values: [own_site, fb_page, denomination, other]}
      - name: service_source_type
        tests:
          - accepted_values: {values: [own_site, fb_page, denomination, other]}
      - name: kids_source_type
        tests:
          - accepted_values: {values: [own_site, fb_page, denomination, other]}
      - name: address_is_worship_location
        tests:
          - accepted_values: {values: ['yes', 'no', 'unknown']}
      - name: muse_batch  # values checked in tests/assert_known_pass_labels.sql
        tests:
          - not_null
      - name: last_pass  # values checked in tests/assert_known_pass_labels.sql

  - name: stg_muse_candidates
    description: One congregation found outside the directory; v2 (A, B) and v3 tasks unified.
    columns:
      - name: candidate_id
        tests: [unique, not_null]
      - name: task  # values checked in tests/assert_known_pass_labels.sql
      - name: format
        tests:
          - accepted_values: {values: [v2, v3]}
      - name: muse_status
        tests:
          - accepted_values: {values: [active, unresolved]}
      - name: address_is_worship_location
        tests:
          - accepted_values: {values: ['yes', 'no', 'unknown']}
      - name: found_via
        tests:
          - accepted_values: {values: [fb_page_search, fb_group_lead, web_search, denomination_directory, host_church_site]}
      - name: host_church_id
        tests:
          - relationships: {to: ref('stg_churches'), field: church_id}
      - name: possible_match_church_id
        tests:
          - relationships: {to: ref('stg_churches'), field: church_id}

  - name: stg_source_checks
    description: Re-verification verdict per subject and fact group.
    columns:
      - name: subject_type
        tests:
          - accepted_values: {values: [church, candidate]}

  - name: stg_geocodes
    description: One Census geocode per subject, with the address it was geocoded from.
    columns:
      - name: geo_id
        tests: [unique, not_null]
      - name: subject_type
        tests:
          - accepted_values: {values: [church, candidate]}
      - name: geocode_status
        tests:
          - not_null
          - accepted_values: {values: [ok, needs_review, failed]}

  - name: int_geocodes
    description: One geocoded subject; pin_usable only while the record keeps the geocoded address.
    columns:
      - name: geo_id
        tests: [unique, not_null]

  - name: int_candidate_readiness
    description: One row per candidate congregation; same display rules as churches.
    columns:
      - name: candidate_id
        tests: [unique, not_null]

  - name: int_scope
    description: Decision D-1 scope per church.
    columns:
      - name: church_id
        tests: [unique, not_null]
      - name: scope_status
        tests:
          - not_null
          - accepted_values: {values: [in_scope, in_scope_labeled, out_of_scope, not_a_congregation, pending, duplicate]}

  - name: int_location_readiness
    description: One row per church; readiness flags and D-3 display rules.
    columns:
      - name: church_id
        tests: [unique, not_null]

  - name: dim_church
    description: One row per church with display-ready, rule-filtered attributes.
    columns:
      - name: church_id
        tests: [unique, not_null]

  - name: mart_coverage_snapshot
    description: Map-readiness funnel; grain geo_scope x source.
    tests:
      - dbt_utils_free_unique_combination:
          combination: "geo_scope || '|' || source"

  - name: mart_muse_scorecard
    description: Muse yield by last pass, with an 'all' rollup row.
    columns:
      - name: last_pass
        tests: [unique, not_null]

  - name: mart_new_congregations
    description: New congregations from Muse discovery, duplicates removed.
    columns:
      - name: candidate_id
        tests: [unique, not_null]

  - name: mart_language_supply
    description: Stated service language x city x origin; congregations, active, shown facts, ready.
    tests:
      - dbt_utils_free_unique_combination:
          combination: "language || '|' || coalesce(city, '') || '|' || origin"

  - name: mart_quality_audit
    description: Owner's blind audit vs Muse, by field, with an 'all' rollup row.
    columns:
      - name: field
        tests: [unique, not_null]

seeds:
  - name: muse_results
    columns:
      - name: church_id
        tests: [unique, not_null]
  - name: quality_reviews
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: verdict
        tests:
          - accepted_values: {values: [agree, disagree, definition_disagreement, needs_review]}
  - name: denomination_scope
    columns:
      - name: denomination_key
        tests: [unique, not_null]
  - name: source_checks
    columns:
      - name: subject_type
        tests:
          - accepted_values: {values: [church, candidate]}
      - name: fact_group
        tests:
          - accepted_values: {values: [status, address, phone, service, kids]}
      - name: verdict
        tests:
          - accepted_values: {values: [verified, partial, not_found, not_an_excerpt, source_gone, fetch_failed, robots_blocked, unsupported, unsafe_url, skipped_facebook, stale]}
  - name: fact_holds
    columns:
      - name: field
        tests:
          - accepted_values: {values: [street_address, phone, service_times]}
